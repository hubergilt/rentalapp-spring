<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head><title th:text="${appName} + ' - ' + (${tenancy.id} != null ? 'Edit tenancy' : 'New tenancy')">Tenancy form</title></head>
<body>
<section>
    <h1 class="h4 mb-3" th:text="${tenancy.id} != null ? 'Edit tenancy' : 'New tenancy'">New tenancy</h1>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <form th:action="${tenancy.id} != null ? @{/tenancies/{id}(id=${tenancy.id})} : @{/tenancies}"
          th:object="${tenancy}" method="post" class="row g-3">

        <div class="col-md-4">
            <label class="form-label">Tenant</label>
            <select class="form-select" th:field="*{tenant}">
                <option value="">Select a tenant</option>
                <option th:each="t : ${tenants}" th:value="${t.id}" th:text="${t.fullName}"></option>
            </select>
            <div class="invalid-feedback d-block text-danger" th:if="${#fields.hasErrors('tenant')}" th:errors="*{tenant}"></div>
        </div>
        <div class="col-md-4">
            <label class="form-label">Room</label>
            <select class="form-select" th:field="*{room}">
                <option value="">Select a room</option>
                <option th:each="r : ${rooms}" th:value="${r.id}" th:text="${r.name}"></option>
            </select>
            <div class="invalid-feedback d-block text-danger" th:if="${#fields.hasErrors('room')}" th:errors="*{room}"></div>
        </div>
        <div class="col-md-4">
            <label class="form-label">Start date</label>
            <input type="date" class="form-control" th:field="*{startDate}"
                   th:classappend="${#fields.hasErrors('startDate')} ? 'is-invalid'"/>
            <div class="invalid-feedback" th:errors="*{startDate}"></div>
        </div>
        <div class="col-md-4">
            <label class="form-label">End date</label>
            <input type="date" class="form-control" th:field="*{endDate}"/>
        </div>
        <div class="col-md-4">
            <label class="form-label">Deposit refund date</label>
            <input type="date" class="form-control" th:field="*{depositRefundDate}"/>
        </div>
        <div class="col-md-4">
            <label class="form-label">Deposit refund amount</label>
            <input type="number" step="0.01" min="0" class="form-control" th:field="*{depositRefundAmount}"/>
        </div>

        <div class="col-12">
            <button type="submit" class="btn btn-primary">Save</button>
            <a class="btn btn-link" th:href="@{/tenancies}">Cancel</a>
        </div>
    </form>
</section>
</body>
</html>
