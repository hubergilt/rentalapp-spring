<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head><title th:text="${appName} + ' - Rooms'">Rooms</title></head>
<body>
<section>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h4 mb-0">Rooms</h1>
        <a class="btn btn-primary btn-sm" th:href="@{/rooms/new}">+ New room</a>
    </div>
    <table class="table table-striped table-hover align-middle">
        <thead>
        <tr><th>Name</th><th>Floor</th><th>Price</th><th>Status</th><th></th></tr>
        </thead>
        <tbody>
        <tr th:each="r : ${rooms}">
            <td><a th:href="@{/rooms/{id}(id=${r.id})}" th:text="${r.name}"></a></td>
            <td th:text="${r.floor}"></td>
            <td th:text="${#numbers.formatDecimal(r.price, 1, 2)}"></td>
            <td><span class="badge" th:classappend="${r.status.name() == 'available'} ? 'text-bg-success' : (${r.status.name() == 'occupied'} ? 'text-bg-warning' : 'text-bg-secondary')"
                      th:text="${r.status}"></span></td>
            <td class="text-end">
                <a class="btn btn-sm btn-outline-secondary" th:href="@{/rooms/{id}/edit(id=${r.id})}">Edit</a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(rooms)}"><td colspan="5" class="text-muted">No rooms found.</td></tr>
        </tbody>
    </table>
</section>
</body>
</html>
