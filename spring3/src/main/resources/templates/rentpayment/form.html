<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head><title th:text="${appName} + ' - ' + (${payment.id} != null ? 'Edit rent payment' : 'New rent payment')">Rent payment form</title></head>
<body>
<section>
    <h1 class="h4 mb-3" th:text="${payment.id} != null ? 'Edit rent payment' : 'New rent payment'">New rent payment</h1>
    <form th:action="${payment.id} != null ? @{/rent-payments/{id}(id=${payment.id})} : @{/rent-payments}"
          th:object="${payment}" method="post" class="row g-3">

        <div class="col-md-4">
            <label class="form-label">Tenant (optional)</label>
            <select class="form-select" th:field="*{tenant}">
                <option value="">— none —</option>
                <option th:each="t : ${tenants}" th:value="${t.id}" th:text="${t.fullName}"></option>
            </select>
        </div>
        <div class="col-md-4">
            <label class="form-label">Room (optional)</label>
            <select class="form-select" th:field="*{room}">
                <option value="">— none —</option>
                <option th:each="r : ${rooms}" th:value="${r.id}" th:text="${r.name}"></option>
            </select>
        </div>
        <div class="col-md-4">
            <label class="form-label">Amount</label>
            <input type="number" step="0.01" min="0.01" class="form-control" th:field="*{amount}"
                   th:classappend="${#fields.hasErrors('amount')} ? 'is-invalid'"/>
            <div class="invalid-feedback" th:errors="*{amount}"></div>
        </div>
        <div class="col-md-4">
            <label class="form-label">Deposit date/time</label>
            <input type="datetime-local" class="form-control" th:field="*{depositDate}"
                   th:classappend="${#fields.hasErrors('depositDate')} ? 'is-invalid'"/>
            <div class="invalid-feedback" th:errors="*{depositDate}"></div>
        </div>
        <div class="col-md-4">
            <label class="form-label">Period</label>
            <input type="date" class="form-control" th:field="*{period}"
                   th:classappend="${#fields.hasErrors('period')} ? 'is-invalid'"/>
            <div class="invalid-feedback" th:errors="*{period}"></div>
        </div>
        <div class="col-md-4">
            <label class="form-label">Remarks</label>
            <input type="text" maxlength="100" class="form-control" th:field="*{remarks}"
                   th:classappend="${#fields.hasErrors('remarks')} ? 'is-invalid'"/>
            <div class="invalid-feedback" th:errors="*{remarks}"></div>
        </div>

        <div class="col-12">
            <button type="submit" class="btn btn-primary">Save</button>
            <a class="btn btn-link" th:href="@{/rent-payments}">Cancel</a>
        </div>
    </form>
</section>
</body>
</html>
