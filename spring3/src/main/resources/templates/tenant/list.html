<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head><title th:text="${appName} + ' - Tenants'">Tenants</title></head>
<body>
<section>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h4 mb-0">Tenants</h1>
        <a class="btn btn-primary btn-sm" th:href="@{/tenants/new}">+ New tenant</a>
    </div>

    <form th:action="@{/tenants}" method="get" class="row g-2 mb-3">
        <div class="col-auto flex-grow-1">
            <input type="text" name="q" class="form-control" placeholder="Search by name or national ID"
                   th:value="${q}"/>
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-outline-secondary">Search</button>
        </div>
    </form>

    <table class="table table-striped table-hover align-middle">
        <thead>
        <tr>
            <th>National ID</th>
            <th>Full name</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="t : ${tenants}">
            <td th:text="${t.nationalId}"></td>
            <td>
                <a th:href="@{/tenants/{id}(id=${t.id})}" th:text="${t.fullName}"></a>
            </td>
            <td class="text-end">
                <a class="btn btn-sm btn-outline-secondary" th:href="@{/tenants/{id}/edit(id=${t.id})}">Edit</a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(tenants)}">
            <td colspan="3" class="text-muted">No tenants found.</td>
        </tr>
        </tbody>
    </table>
</section>
</body>
</html>
